# Runs the whole app: PostgreSQL -> Spring Boot backend -> nginx serving the React frontend.
#   docker compose up --build        then open http://localhost:3000
# Settings can be overridden in a root .env file (see .env.example); the defaults below work out of the box.

name: leaveflow

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leaveflow}
      POSTGRES_USER: ${POSTGRES_USER:-leaveflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leaveflow}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # 5433 on the host, so it does not clash with a locally installed PostgreSQL on 5432.
      - "${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-leaveflow}
      DB_USERNAME: ${POSTGRES_USER:-leaveflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-leaveflow}
      # Defaults to the development key from application.yml; set your own in .env for anything public.
      JWT_SECRET: ${JWT_SECRET:-XkTeVzddfqNkK+/oQvr7EGhYRcRo4IVLNSQmxkeG/uI=}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-true}
    ports:
      # Optional: lets you call the API / Swagger UI directly on http://localhost:8080.
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 10
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped

volumes:
  db-data:
