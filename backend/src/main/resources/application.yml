spring:
  application:
    name: leaveflow

  # For local runs, values such as DB_PASSWORD can live in backend/.env (git-ignored).
  # Real environment variables (e.g. from docker-compose) always take precedence over this file.
  config:
    import: optional:file:.env[.properties]

  # Connection details come from environment variables so the same jar runs locally and in Docker.
  # The defaults below are for local development only.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/leaveflow_misl_assignment}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  data:
    web:
      pageable:
        max-page-size: 100

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  jwt:
    # Base64-encoded 256-bit key used to sign access tokens. The default is for local development only;
    # set JWT_SECRET to a new random value anywhere else.
    secret: ${JWT_SECRET:XkTeVzddfqNkK+/oQvr7EGhYRcRo4IVLNSQmxkeG/uI=}
    # Short-lived, stateless token sent as "Authorization: Bearer ..." on every API call.
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:15m}
    # Long-lived, revocable token stored (hashed) in the database and sent as an httpOnly cookie.
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:7d}
    # Must be true when served over HTTPS; false allows the cookie on http://localhost.
    cookie-secure: ${JWT_COOKIE_SECURE:false}
    # Nightly clean-up of expired refresh tokens (03:00 server time).
    cleanup-cron: ${JWT_CLEANUP_CRON:0 0 3 * * *}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
