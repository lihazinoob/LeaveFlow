# Serves the React build and forwards API calls to the backend container.
# The browser sees a single origin, so the refresh-token cookie (SameSite=Strict, Path=/api/auth) works without CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # REST API and Swagger UI -> Spring Boot ("backend" is the service name in docker-compose.yml).
    location ~ ^/(api|swagger-ui|v3/api-docs)(/|\.html|$) {
        proxy_pass http://backend:8080;
        # $http_host keeps the port, so Swagger UI builds "Try it out" URLs for the right address.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Built files have a content hash in their name, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths (e.g. /leaves after a reload) return index.html and React Router takes over.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
